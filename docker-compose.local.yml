name: sentinel-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the local setup first}
      POSTGRES_DB: sentinel_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel_ai
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://127.0.0.1:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 6
    volumes:
      - uploads:/app/backend/uploads
      - cognitive_data:/app/backend/data
    ports:
      - "127.0.0.1:8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    environment:
      SENTINEL_ADMIN_USER: ${SENTINEL_ADMIN_USER:?Run the local setup first}
      SENTINEL_ADMIN_PASSWORD_HASH: ${SENTINEL_ADMIN_PASSWORD_HASH:?Run the local setup first}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  qdrant_data:
  uploads:
  cognitive_data:
