name: Sentinel checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: unit-test-placeholder
      DATABASE_URL: "sqlite:///:memory:"
      HF_HOME: ${{ github.workspace }}/.local/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-cpu.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/cache_embeddings.py
      - run: python -m pytest tests -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run test:run && npm run build
        working-directory: frontend
